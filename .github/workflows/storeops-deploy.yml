name: StoreOps CI/CD - Build & Deploy to Azure App Service (Publish Profile)

on:
  push:
    branches: [ main ]
    paths:
      - 'applications/storeops/**'
      - '.github/workflows/storeops-deploy-publishprofile.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'applications/storeops/**'
  workflow_dispatch: {}

env:
  AZURE_WEBAPP_NAME: storeops-app-azuser8168-IxXPn   # matches your sandbox Web App name
  WORKING_DIR: applications/storeops
  JAVA_VERSION: '21'

permissions:
  contents: read
  # NOTE: no id-token: write needed — publish-profile auth doesn't use OIDC

jobs:
  # -------------------------------------------------------------------------
  # Job 1: Build, test, and package the Maven project
  # -------------------------------------------------------------------------
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'
          cache-dependency-path: ${{ env.WORKING_DIR }}/pom.xml

      - name: Build and run tests
        working-directory: ${{ env.WORKING_DIR }}
        run: mvn -B clean verify

      - name: Package application (skip re-running tests)
        working-directory: ${{ env.WORKING_DIR }}
        run: mvn -B package -DskipTests

      - name: Locate built JAR
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          JAR_PATH=$(find target -maxdepth 1 -name "*.jar" ! -name "*-sources.jar" | head -n 1)
          echo "Found artifact: $JAR_PATH"
          cp "$JAR_PATH" target/app.jar

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: storeops-jar
          path: ${{ env.WORKING_DIR }}/target/app.jar
          retention-days: 5

  # -------------------------------------------------------------------------
  # Job 2: Deploy directly to production using the publish profile
  #         (No staging slot / swap here — sandbox SKU is typically
  #         Free/Basic tier, which doesn't support deployment slots.)
  # -------------------------------------------------------------------------
  deploy:
    name: Deploy to Azure App Service
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: storeops-jar
          path: ./deploy

      - name: Deploy JAR to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./deploy/app.jar

      - name: Smoke test
        run: |
          sleep 20
          curl -sf https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/actuator/health || \
          curl -sf https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/
