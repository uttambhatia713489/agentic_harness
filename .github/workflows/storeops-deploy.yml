name: StoreOps CI/CD - Build & Deploy to Azure App Service (Publish Profile)

on:
  push:
    branches: [ main ]
    paths:
      - 'applications/storeops/**'
      - '.github/workflows/storeops-deploy.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'applications/storeops/**'
  workflow_dispatch: {}

env:
  AZURE_WEBAPP_NAME: storeops-app-azuser8168-IxXPn   # matches your sandbox Web App name
  WORKING_DIR: applications/storeops
  JAVA_VERSION: '21'

permissions:
  contents: read
  # NOTE: no id-token: write needed — publish-profile auth doesn't use OIDC

jobs:
  # -------------------------------------------------------------------------
  # Job 1: Build, test, and package the Maven project
  # -------------------------------------------------------------------------
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'
          cache-dependency-path: ${{ env.WORKING_DIR }}/pom.xml

      - name: Build and run tests
        working-directory: ${{ env.WORKING_DIR }}
        run: mvn -B clean verify

      - name: Package application (skip re-running tests)
        working-directory: ${{ env.WORKING_DIR }}
        run: mvn -B package -DskipTests

      - name: Locate built JAR
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          JAR_PATH=$(find target -maxdepth 1 -name "*.jar" ! -name "*-sources.jar" | head -n 1)
          echo "Found artifact: $JAR_PATH"
          cp "$JAR_PATH" target/app.jar

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: storeops-jar
          path: ${{ env.WORKING_DIR }}/target/app.jar
          retention-days: 5

  # -------------------------------------------------------------------------
  # Job 2: Deploy directly to production using the publish profile
  #         (No staging slot / swap here — sandbox SKU is typically
  #         Free/Basic tier, which doesn't support deployment slots.)
  # -------------------------------------------------------------------------
  deploy:
    name: Deploy to Azure App Service
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: storeops-jar
          path: ./deploy

      - name: Deploy JAR to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./deploy/app.jar

      - name: Smoke test (Actuator health check, with retry)
        run: |
          HEALTH_URL="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/actuator/health"
          MAX_ATTEMPTS=10
          SLEEP_SECONDS=15

          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo "Attempt $i/$MAX_ATTEMPTS: checking $HEALTH_URL ..."
            HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" "$HEALTH_URL" || echo "000")
            BODY=$(cat /tmp/response.txt 2>/dev/null || echo "")
            echo "HTTP status: $HTTP_CODE"
            echo "Response body: $BODY"

            if [ "$HTTP_CODE" = "200" ] && echo "$BODY" | grep -q '"status":"UP"'; then
              echo "App is healthy (status 200, UP)."
              exit 0
            fi

            echo "Not healthy yet, waiting ${SLEEP_SECONDS}s before retry..."
            sleep $SLEEP_SECONDS
          done

          echo "App did not report healthy after $MAX_ATTEMPTS attempts."
          echo "Check 'az webapp log tail' for startup errors."
          exit 1
